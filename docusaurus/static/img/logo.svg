<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#006345" flood-opacity="0.14" />
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FDF9" />
      <stop offset="100%" stop-color="#E5FCEF" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="72" y="72" width="880" height="880" rx="220" ry="220" fill="url(#bgGrad)" stroke="#A7F3D0" stroke-width="6" />

  <!-- Map Grid Overlay -->
  <g opacity="0.75" stroke="#C6F6D5" stroke-linecap="round">
    <!-- Diagonal Road 1 -->
    <line x1="80" y1="520" x2="620" y2="80" stroke-width="48" stroke="#D1FAE5" />
    <!-- Diagonal Road 2 -->
    <line x1="420" y1="940" x2="940" y2="340" stroke-width="48" stroke="#D1FAE5" />
    <!-- Cross Road 1 -->
    <line x1="160" y1="160" x2="880" y2="760" stroke-width="38" stroke="#D1FAE5" />
    <!-- Dashed Route Line -->
    <line x1="330" y1="80" x2="940" y2="670" stroke-width="24" stroke="#6EE7B7" stroke-dasharray="24 24" />
  </g>

  <!-- Shadow Group for Central Arrow -->
  <g filter="url(#shadow)">
    <!-- Left Facet (Light Jade / Emerald) -->
    <path d="M512 430 L345 385 C330 381 320 395 328 408 L512 715 Z" fill="#00B47C" />
    <!-- Right Facet (Deep Emerald / Forest) -->
    <path d="M512 430 L679 385 C694 381 704 395 696 408 L512 715 Z" fill="#00845C" />
    <!-- Soft highlight seam -->
    <line x1="512" y1="430" x2="512" y2="715" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  </g>

  <!-- Target Radar below Arrow -->
  <circle cx="512" cy="770" r="28" fill="none" stroke="#00B47C" stroke-width="5" stroke-dasharray="8 8" />
  <circle cx="512" cy="770" r="12" fill="#00845C" />

  <!-- Typography -->
  <text x="512" y="865" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="800" font-size="38" fill="#006345" letter-spacing="14">RUTA VIVA</text>
</svg>
